name: PixlVoucher
options:
  bundleIdPrefix: com.pixl
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  PixlVoucher:
    type: application
    platform: iOS
    sources:
      - path: PixlVoucher
        excludes:
          - "**/Info.plist"
        # Assets.xcassets under this path is auto-classified into the
        # Resources build phase by XcodeGen; listing it again separately
        # under `resources:` would add it twice and break the build.
    info:
      path: PixlVoucher/Info.plist
      properties:
        CFBundleDisplayName: PIXL Voucher
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: >-
          PIXL Voucher connects to your MikroTik router over your local
          Wi-Fi network to create hotspot vouchers.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBluetoothAlwaysUsageDescription: >-
          PIXL Voucher uses Bluetooth to connect to your receipt printer
          and print vouchers.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixl.voucher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
